[package]
name = "oraurust-core"
version = "0.1.0"
edition = "2024"
description = "UI-free logic core for oraurust: Script splitting and the Connection seam"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"
