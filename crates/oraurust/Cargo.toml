[package]
name = "oraurust"
version = "0.1.0"
edition = "2024"
description = "PL/SQL desktop editor for Oracle 11g (spec: GitHub issue #1)"

[dependencies]
gpui-kit = { version = "=0.10.0", features = ["tree-sitter"] }
tree-sitter = "0.26.13"
oraurust-core = { path = "../core" }
oracle = "0.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flume = "0.12"

[build-dependencies]
cc = "1.0"
